name: weekly-refresh

on:
  schedule:
    # Monday 14:00 UTC, after USAspending's weekend loads have usually landed.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pull and rebuild
        run: |
          uv sync
          uv run python -m livingry.fetch
          uv run python -m livingry.build
          uv run python -m livingry.workbook
          uv run python -m livingry.figures
          uv run pytest -q
      - name: Commit extracts
        run: |
          git config user.name "livingry-dashboard"
          git config user.email "jason@jasonpellerin.com"
          git add tableau/exports app/data reports
          git diff --cached --quiet && echo "no change" || git commit -m "Weekly refresh of the Livingry Dashboard extracts"
          git pull --rebase --autostash
          git push
