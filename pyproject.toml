[project]
name = "livingry-dashboard"
version = "0.1.0"
description = "Public dashboard for The Livingry Protocol: the indicators the manuscript names, in their own units, refreshed from public sources. No composite score."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jason Pellerin", email = "jason@jasonpellerin.com" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "streamlit>=1.40",
    "plotly>=5.24",
    "tableauhyperapi==0.0.26479",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livingry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
